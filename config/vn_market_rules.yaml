# Vietnam market microstructure constants (single source of truth — audit D2/C2).
# Used by backtests for price-band (ceiling/floor) heuristics and holding constraints.

price_bands:
  HOSE: 0.07
  HNX: 0.10
  UPCOM: 0.15

# Default band when a symbol's exchange is unknown (conservative: HOSE).
default_price_band: 0.07

lot_size: 100

# Settlement: shares bought on T are sellable from the afternoon session of T+2 ("T+2.5").
min_holding_sessions: 3
